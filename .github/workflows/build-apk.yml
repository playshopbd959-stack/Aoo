name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_VER=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version from output:"
            echo "$JAVA_VERSION_OUTPUT"
            exit 1
          fi
          echo "Detected Java version: $JAVA_VER"
          JAVA_MAJOR=$(echo "$JAVA_VER" | sed -E 's/^1\.([0-9]+).*/\1/; s/^([0-9]+).*/\1/')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not parse Java major version from '$JAVA_VER'"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Discovered APK files in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match expected path."
            exit 1
          fi

          echo "Verified debug APK exists and is a valid non-empty file: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="$TEMP_RELEASE_DIR/$RELEASE_FILENAME"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_APK"

          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "Error: Failed to prepare release asset at $DEST_APK"
            exit 1
          fi

          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at $DEST_APK ($RELEASE_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"
          APK_FILE="${{ steps.prepare_asset.outputs.apk_path }}"

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "Error: Release asset is missing or empty: $APK_FILE"
            exit 1
          fi

          case "$APK_FILE" in
            *.apk) ;;
            *) echo "Error: Release asset is not an APK: $APK_FILE"; exit 1 ;;
          esac

          RELEASE_NOTES="### Debug APK Build Details

          - **Build Type**: Automatically generated debug APK
          - **Built By**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: \`${TARGET_COMMIT}\`
          - **Notice**: This APK is intended for testing and development purposes. It is **not** a production release for the Google Play Store.
          - **Signing**: Signed exclusively with a temporary debug keystore."

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$APK_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          APK_NAME="${{ steps.prepare_asset.outputs.apk_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================="
            echo "GitHub Release Publishing Succeeded!"
            echo "=========================================="
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $APK_NAME"

            {
              echo "### 🚀 Debug APK Published to GitHub Releases"
              echo ""
              echo "**Release Tag:** \`$RELEASE_TAG\`"
              echo ""
              echo "**Release Title:** $RELEASE_TITLE"
              echo ""
              echo "🔗 **[Download APK from GitHub Release Assets]($RELEASE_URL)**"
              echo ""
              echo "The debug APK (\`$APK_NAME\`) is available for download directly under the **Assets** section of the release above."
              echo ""
              echo "📦 *Backup:* The standard GitHub Actions workflow artifact (\`app-debug-apk\`) is also available in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================="
            echo "WARNING: GitHub Release Publishing Failed or was Skipped"
            echo "=========================================="
            echo "The debug APK build and Actions artifact upload SUCCEEDED."
            echo "The APK artifact 'app-debug-apk' remains safely available in this workflow run."

            {
              echo "### ⚠️ GitHub Release Publishing Notice"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases did not complete. However, the APK build and artifact upload succeeded."
              echo ""
              echo "📦 **How to download your APK:**"
              echo "Download the **app-debug-apk** artifact directly from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
